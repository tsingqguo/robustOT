train_dataset:
  dataset:
    name: paired-h5-image-dbs
    args:
      root: $TRAIN_DSET_PATH/../train_mod/fgsm
      h5fp:
        - N5/vid00.h5
        - [coco.h5, 100000, 'index']
      first_k: 999999
      repeat: 1
      shuffle: true
      cache_index_fp:
        - index_vid_ytbb_unique.json
        - index_coco_central.json
      n_length: 5 # TODO:
      db_n_length: 5
      object_cls_files:
        - data/labels/train.json
  wrapper:
    name: sr-implicit-paired-adv
    args:
      inp_size: 100
      augment: true
      n_length: 5 # TODO:
      central_crop_region:  128
      frame_wise_augmentation_args:
        # disable: True
        max_shift_x: 0.1
        max_shift_y: 0.1
        max_scale_x: 0.1
        max_scale_y: 0.1
        max_rotation: 5
  batch_size: 16

val_dataset:
  dataset:
    name: paired-h5-image-dbs
    args:
      root: $TRAIN_DSET_PATH/../train_mod/fgsm
      h5fp:
        - N5/vid09.h5
        - [coco.h5, -17266, 'index']
      first_k: 50000
      repeat: 1
      shuffle: true
      cache_index_fp:
        - index_vid_ytbb_unique.json
        - index_coco_central.json
      n_length: 5 # TODO:
      db_n_length: 5
      object_cls_files:
        - data/labels/train.json
  wrapper:
    name: sr-implicit-paired-adv
    args:
      inp_size: 100
      augment: true
      n_length: 5 # TODO:
      central_crop_region:  128
      frame_wise_augmentation_args:
        # disable: True
        max_shift_x: 0.1
        max_shift_y: 0.1
        max_scale_x: 0.1
        max_scale_y: 0.1
        max_rotation: 5
  batch_size: 32

data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}

optimizer:
  name: adam
  args:
    lr: 1.e-4
epoch_max: 10
multi_step_lr:
  milestones: [200, 400, 600, 800]
  gamma: 0.5

epoch_val: 1
epoch_save: 1

L2_reg:
   flag: False
   weight: 0
gram_reg:
   flag: False
   weight: 0
